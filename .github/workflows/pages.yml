# Renders every .culina recipe into a static site with culina-site and
# publishes it to GitHub Pages. The tool lives in the culina repo, the
# recipes live here; scripts/build-site.sh adds the style picker.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # this repo: the recipes
      - uses: actions/checkout@v4
        with:
          repository: kitlaan/culina
          path: .culina-src  # hidden: culina-site skips it
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the site
        run: scripts/build-site.sh public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
