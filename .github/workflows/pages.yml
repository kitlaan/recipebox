# Renders every .culina recipe into a static site with culina-site and
# publishes it to GitHub Pages. Nothing hand-written here — the tool lives
# in the culina repo, the recipes live here.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # this repo: the recipes
      - uses: actions/checkout@v4
        with:
          repository: kitlaan/culina
          path: culina
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the site
        run: |
          cargo build --release --manifest-path culina/Cargo.toml -p culina-site
          culina/target/release/culina-site --in . --out public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
